# --- True color support ---

# Tell tmux to advertise 256-color support to apps inside it.
# "tmux-256color" is the correct value here (not xterm-256color).
# tmux needs its own terminal type to handle features like italics correctly.
set -g default-terminal "tmux-256color"

# Tell tmux that the terminal OUTSIDE (Alacritty) supports true color (RGB).
# Without this, tmux strips 24-bit colors down to 256.
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Fish as default shell ---
set -g default-shell /usr/bin/fish

# --- Quality of life ---

# Start window/pane numbering at 1 (0 is far from the other keys)
set -g base-index 1
setw -g pane-base-index 1

# Reduce escape delay (important for nvim — without this, Esc feels sluggish)
set -sg escape-time 10

# Enable mouse (resize panes, scroll, click tabs)
set -g mouse on

# Increase scrollback buffer (default 2000 is too small)
set -g history-limit 50000

# --- Ayu mirage status bar (manual, no plugin needed) ---

# Status bar background matches ayu mirage bg
set -g status-style "bg=#212733,fg=#d9d7ce"

# Active window tab — highlighted with ayu blue
setw -g window-status-current-style "bg=#73d0ff,fg=#212733,bold"

# Inactive window tabs — subtle
setw -g window-status-style "bg=#2f3b54,fg=#d9d7ce"

# Pane borders
set -g pane-border-style "fg=#2f3b54"
set -g pane-active-border-style "fg=#73d0ff"

# Message bar (e.g. when you hit prefix + :)
set -g message-style "bg=#ffd580,fg=#212733"
